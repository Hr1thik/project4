apiVersion: apps/v1
kind: Deployment
metadata:
  name: project4-deployment
  labels:
    app: project4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project4
  template:
    metadata:
      labels:
        app: project4
    spec:
      containers:
        - name: project4
          image: hr1thik/project4:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: project4-service
spec:
  type: NodePort
  selector:
    app: project4
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30084